name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    name: Compile check (no Apple account needed)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for watch simulator
        run: |
          xcodebuild build \
            -project TakeCareOf.xcodeproj \
            -scheme TakeCareOf \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    name: Simulator screenshots
    needs: compile
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build for a simulator device and capture
        run: |
          brew install xcodegen
          xcodegen generate
          SIM=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];c=[x for k,v in d.items() if 'watchOS' in k for x in v];print(([x for x in c if 'Ultra' in x['name']]+c)[0]['udid'])")
          echo "Simulator: $SIM"
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b
          xcodebuild build -project TakeCareOf.xcodeproj -scheme TakeCareOf -destination "id=$SIM" -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          APP=$(find build/Build/Products -name '*.app' | head -1)
          xcrun simctl install "$SIM" "$APP"
          mkdir -p shots
          for page in home status food foodshop play focus genre explore loot treasure shop dress goals worm shiny read walk wash pet sleep confirm; do
            xcrun simctl terminate "$SIM" com.jjuggu.takecareof >/dev/null 2>&1 || true
            SIMCTL_CHILD_CROW_DEMO="$page" xcrun simctl launch "$SIM" com.jjuggu.takecareof >/dev/null
            sleep 4
            xcrun simctl io "$SIM" screenshot "shots/$page.png"
          done
      - name: Publish screenshots to a separate branch
        run: |
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Simulator screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  testflight:
    name: Upload to TestFlight
    needs: compile
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "App Store Connect secrets are not set yet. Skipping upload."
          fi
      - name: Generate Xcode project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Write API key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcodebuild archive \
            -project TakeCareOf.xcodeproj \
            -scheme TakeCareOf \
            -destination 'generic/platform=watchOS' \
            -archivePath "$RUNNER_TEMP/TakeCareOf.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Upload
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TakeCareOf.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
