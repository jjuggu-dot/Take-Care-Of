name: TakeCareOf
options:
  bundleIdPrefix: com.jjuggu
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TakeCareOf:
    type: application
    platform: watchOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjuggu.takecareof
        PRODUCT_NAME: Take Care Of
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Take Care Of
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMotionUsageDescription: 산책할 때 걸음 수를 세어 까마귀 보상을 주는 데 사용해요.
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: NO
